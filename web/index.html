<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectDock 项目坞</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo"><img class="logo-mark" src="/logo.png" alt="ProjectDock"><span>ProjectDock</span></div>
      <div class="root-path" id="rootPath" title=""></div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-filter="all"><span class="nav-ico">◉</span><span>全部项目</span><span class="count" id="countAll">0</span></button>
      <button class="nav-item" id="btnConsole" data-view="console"><span class="nav-ico">▦</span><span>总控台</span></button>
      <div class="nav-label">类型</div>
      <div class="type-filters" id="typeFilters"></div>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" id="btnImport"><span class="nav-ico">⇪</span><span>导入项目</span></button>
      <button class="nav-item" id="btnSettings"><span class="nav-ico">⚙</span><span>设置</span></button>
      <div class="app-version" id="appVersion">v0.1.0</div>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="search">
        <span class="search-ico">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索项目…" autocomplete="off">
      </div>
      <div class="view-ctrl">
        <div class="seg" id="viewSeg">
          <button class="seg-btn active" data-view="grid" title="图格视图">▦</button>
          <button class="seg-btn" data-view="list" title="列表视图">☰</button>
        </div>
        <select id="sortSelect" title="排序方式">
          <option value="pinned">置顶优先</option>
          <option value="updated">最近更新</option>
          <option value="created">创建时间</option>
          <option value="name">名称 A-Z</option>
          <option value="type">类型</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnNewProject"><span>＋</span> 新建项目</button>
    </header>
    <section class="grid" id="grid"></section>
    <section class="console" id="console" hidden></section>
    <section class="empty" id="empty" hidden>
      <div class="empty-ico" id="emptyIco">▢</div>
      <p id="emptyTitle">这里还没有项目</p>
      <p class="empty-sub" id="emptySub">点击右上角「新建项目」开始，或用「导入项目」纳入已有文件夹</p>
    </section>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" hidden>
    <header class="drawer-head">
      <button class="icon-btn" id="btnDrawerClose" title="返回">‹</button>
      <span class="drawer-logo type-其他" id="drawerLogo"></span>
      <div class="drawer-title">
        <h2 id="drawerName"></h2>
        <div class="drawer-sub">
          <span class="badge" id="drawerType"></span>
          <span class="drawer-path" id="drawerPath"></span>
        </div>
      </div>
      <div class="drawer-actions">
        <button class="icon-btn" id="btnDrawerFull" title="对话窗口全屏/还原">⤢</button>
        <button class="icon-btn" id="btnOpenFolder" title="打开文件夹">↗</button>
        <button class="icon-btn" id="btnCopyPath" title="复制路径">⧉</button>
      </div>
    </header>
    <nav class="tabs" id="drawerTabs"></nav>
    <div class="drawer-body">
      <section class="panel active" id="panel-overview"></section>
      <section class="panel" id="panel-versions"></section>
      <section class="panel" id="panel-compliance"></section>
      <section class="panel" id="panel-docs"></section>
      <section class="panel" id="panel-github"></section>
      <section class="panel" id="panel-ailog"></section>
      <section class="panel" id="panel-techstack"></section>
      <section class="panel" id="panel-ai">
        <div class="chat">
          <div class="chat-msgs" id="chatMsgs">
            <div class="chat-hint">用自然语言向 AI 项目助手下达要求。任务将在当前项目目录中执行，输出会实时回显。</div>
          </div>
          <div class="chat-dock">
            <div class="chat-input">
              <select id="agentSelect" title="AI 后端"></select>
              <input id="chatInput" placeholder="例如：帮我初始化 git 并提交当前代码…" autocomplete="off">
              <button class="btn btn-primary" id="chatSend">发送</button>
            </div>
            <div class="chat-presets" id="chatPresets"></div>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <div class="modal-backdrop" id="newBackdrop" hidden>
    <div class="modal" id="newModal">
      <header class="modal-head"><h3>新建项目</h3><button class="icon-btn" data-close="new">✕</button></header>
      <form id="newForm">
        <label class="field"><span>项目名称</span><input name="name" required maxlength="60" placeholder="例如：待办清单"></label>
        <label class="field"><span>项目类型</span><select name="type" id="newType"></select></label>
        <label class="field"><span>描述</span><textarea name="description" rows="2" placeholder="一句话说明这个项目…"></textarea></label>
        <label class="check"><input type="checkbox" name="preset" checked><span>使用预设一键初始化（含 git init + 首次提交）</span></label>
        <label class="check"><input type="checkbox" name="github"><span>创建 GitHub 仓库并推送</span></label>
        <div class="preset-hint" id="presetHint"></div>
        <footer class="modal-foot">
          <button type="button" class="btn" data-close="new">取消</button>
          <button type="submit" class="btn btn-primary">创建项目</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="iconBackdrop" hidden>
    <div class="modal">
      <header class="modal-head"><h3>设置项目图标</h3><button class="icon-btn" data-close="icon">✕</button></header>
      <div class="icon-picker">
        <div class="icon-preview-wrap"><span class="icon-preview" id="iconPreview"></span></div>
        <div class="icon-actions">
          <button class="btn btn-sm" id="btnIconAuto">🎨 按类型一键生成</button>
          <label class="btn btn-sm file-btn">📁 上传图片<input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>
        </div>
        <div class="icon-symbols" id="iconSymbols"></div>
        <p class="icon-hint">生成图标会写入项目根目录 logo.png；上传图片需为 PNG/JPEG/WebP/GIF（≤8MB）。</p>
        <footer class="modal-foot">
          <button type="button" class="btn" data-close="icon">关闭</button>
          <button type="button" class="btn btn-primary" id="btnIconApply" disabled>应用图标</button>
        </footer>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="editBackdrop" hidden>
    <div class="modal">
      <header class="modal-head"><h3>编辑项目信息</h3><button class="icon-btn" data-close="edit">✕</button></header>
      <form id="editForm">
        <label class="field"><span>项目名称</span><input name="name" maxlength="60" placeholder="项目标题（变更会重命名文件夹）"></label>
        <label class="field"><span>项目类型</span><select name="type" id="editType"></select></label>
        <label class="field"><span>描述</span><textarea name="description" rows="3"></textarea></label>
        <p class="edit-hint">名称 / 类型变更会同步重命名项目文件夹（保留编号前缀）；描述与图标信息保存在 ProjectDock 中。</p>
        <footer class="modal-foot">
          <button type="button" class="btn" data-close="edit">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="importBackdrop" hidden>
    <div class="modal">
      <header class="modal-head"><h3>导入已有文件夹</h3><button class="icon-btn" data-close="import">✕</button></header>
      <form id="importForm">
        <label class="field"><span>文件夹路径</span><input name="path" required placeholder="例如：E:/.../参考资料"></label>
        <label class="field"><span>项目类型</span><select name="type" id="importType"></select></label>
        <label class="field"><span>描述</span><input name="description" placeholder="可选"></label>
        <footer class="modal-foot">
          <button type="button" class="btn" data-close="import">取消</button>
          <button type="submit" class="btn btn-primary">导入</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="settingsBackdrop" hidden>
    <div class="modal">
      <header class="modal-head"><h3>设置</h3><button class="icon-btn" data-close="settings">✕</button></header>
      <form id="settingsForm">
        <label class="field"><span>管理根目录</span><input name="root" placeholder="项目文件夹所在目录"></label>
        <label class="field"><span>AI 后端</span><select name="agent"><option value="claude">Claude Code</option><option value="pi">Pi</option></select></label>
        <label class="field"><span>主题</span><select name="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <label class="check"><input type="checkbox" name="github_auto" checked><span>新建项目自动创建 GitHub 仓库并推送</span></label>
        <label class="field"><span>仓库可见性</span><select name="github_visibility"><option value="private">私有</option><option value="public">公开</option></select></label>
        <label class="field"><span>GitHub 账号（项目远程仓库管理）</span>
          <div class="gh-auth-box">
            <div class="gh-auth-status" id="ghAuthStatus">检测中…</div>
            <div class="gh-auth-actions">
              <button type="button" class="btn btn-sm" id="btnGhRefresh">刷新检测</button>
              <button type="button" class="btn btn-sm btn-danger" id="btnGhLogout" hidden>退出登录</button>
            </div>
            <div class="gh-token-row">
              <input id="ghTokenInput" placeholder="粘贴 GitHub 个人访问令牌（PAT，repo 权限）" autocomplete="off" spellcheck="false">
              <button type="button" class="btn btn-sm btn-primary" id="btnGhLogin">登录</button>
            </div>
            <p class="gh-hint">优先使用 gh 命令行登录态（gh auth login）；无 gh 时在此粘贴令牌。创建令牌：<a href="https://github.com/settings/tokens" target="_blank" rel="noopener">github.com/settings/tokens</a></p>
          </div>
        </label>
        <label class="check"><input type="checkbox" name="backup" checked><span>AI 任务 / 发布前自动备份（zip 快照到 versions/backups/）</span></label>
        <label class="field"><span>确认策略（勾选的操作在执行前需要用户确认；AI agent 必须先征得同意）</span>
          <div class="policy-editor">
            <label class="check"><input type="checkbox" name="policy_push" checked><span>推送 GitHub</span></label>
            <label class="check"><input type="checkbox" name="policy_delete" checked><span>删除文件</span></label>
            <label class="check"><input type="checkbox" name="policy_github_create" checked><span>创建 GitHub 仓库</span></label>
            <label class="check"><input type="checkbox" name="policy_release" checked><span>发布 Release</span></label>
            <label class="check"><input type="checkbox" name="policy_archive" checked><span>归档移动构建产物</span></label>
          </div>
        </label>
        <label class="field"><span>软件更新（自动检查 GitHub Releases）</span>
          <div class="update-box">
            <div class="update-row"><span>当前版本：v<span id="updateCurrent"></span></span><span class="spacer"></span><button type="button" class="btn btn-sm" id="btnCheckUpdate">检查更新</button></div>
            <div class="update-status" id="updateStatus"></div>
            <div id="updateActions" hidden>
              <div class="update-info" id="updateInfo"></div>
              <div class="action-row"><button type="button" class="btn btn-sm btn-primary" id="btnDownloadUpdate">下载并安装</button></div>
            </div>
          </div>
        </label>
        <label class="field"><span>更新仓库（owner/repo）</span><input name="update_repo" placeholder="GinyvaXu/ProjectDock"></label>
        <label class="field"><span>类型菜单模板（勾选该类型显示的菜单；软件类含版本/构建，文稿类显示文稿版本）</span><div class="type-tabs-editor" id="typeTabsEditor"></div></label>
        <footer class="modal-foot">
          <button type="button" class="btn" id="btnManageTypes">自定义类型</button>
          <button type="button" class="btn" data-close="settings">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="typesBackdrop" hidden>
    <div class="modal modal-wide">
      <header class="modal-head"><h3>自定义类型</h3><button class="icon-btn" data-close="types">✕</button></header>
      <div class="types-list" id="customTypesList"></div>
      <form id="typesForm">
        <div class="types-grid">
          <label class="field"><span>类型名称（唯一）</span><input name="name" required maxlength="40" placeholder="例如：数据分析"></label>
          <label class="field"><span>显示名（可选）</span><input name="label" maxlength="40" placeholder="例如：数据分析"></label>
        </div>
        <label class="field"><span>描述</span><input name="description" placeholder="一句话说明该类型结构"></label>
        <label class="field"><span>目录结构（逗号分隔）</span><input name="dirs" placeholder="例如：data,notebooks,output"></label>
        <label class="field"><span>骨架文件模板（=== 分隔，首行为文件名）</span>
          <textarea name="files" rows="6" placeholder="README.md&#10;# {title}&#10;{description}&#10;===&#10;.gitignore&#10;__pycache__/"></textarea>
        </label>
        <label class="check"><input type="checkbox" name="git" checked><span>初始化 git</span></label>
        <footer class="modal-foot">
          <button type="submit" class="btn btn-primary">添加类型</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="releaseBackdrop" hidden>
    <div class="modal modal-wide">
      <header class="modal-head"><h3>发布向导</h3><button class="icon-btn" data-close="release">✕</button></header>
      <form id="releaseForm">
        <div class="types-grid">
          <label class="field"><span>当前版本</span><input name="current" readonly></label>
          <label class="field"><span>新版本号</span><input name="version" required placeholder="1.2.3">
            <div class="ver-bumps">
              <button type="button" class="btn btn-sm" data-bump="patch">补丁 +0.0.1</button>
              <button type="button" class="btn btn-sm" data-bump="minor">次版本 +0.1.0</button>
              <button type="button" class="btn btn-sm" data-bump="major">主版本 +1.0.0</button>
            </div>
          </label>
        </div>
        <label class="field"><span>更新日志（Added）</span><textarea name="changelog" rows="4" placeholder="- 新功能描述，每行一条"></textarea></label>
        <label class="field"><span>构建脚本（可选）</span><select name="build"><option value="">不构建</option></select></label>
        <label class="check"><input type="checkbox" name="push" checked><span>git 提交 + 打 tag + 推送 + GitHub Release</span></label>
        <div id="releaseLogBox"></div>
        <footer class="modal-foot">
          <button type="button" class="btn" data-close="release">取消</button>
          <button type="submit" class="btn btn-primary" id="releaseStart">开始发布</button>
        </footer>
      </form>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
</div>
<script src="/js/spring.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
